# Builds every brand and verifies the output on each push.
# Cloudflare does the real deploys; this is the safety net.
# Results are written as annotations so they're readable without the raw logs.
name: Check build
permissions:
  contents: write
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  pipeline:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 in Oct 2026 and broke the Playwright install
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install typecheck tools (isolated from the site's packages)
        working-directory: workers/pipeline
        run: npm init -y >/dev/null && npm install --no-audit --no-fund typescript@5 @cloudflare/workers-types@4
      - name: Typecheck the pipeline Worker
        run: |
          if ! (cd workers/pipeline && npx tsc -p .) > tsc.log 2>&1; then
            node -e "const l=require('fs').readFileSync('tsc.log','utf8').trim().split('\n').slice(0,30).join('\n');console.log('::error title=Pipeline typecheck::'+l.replace(/%/g,'%25').replace(/\r?\n/g,'%0A'))"
            exit 1
          fi
      - name: Typecheck the site Worker (email signups)
        run: |
          cp -r workers/pipeline/node_modules src/worker/node_modules
          if ! (cd src/worker && npx tsc -p .) > tsc2.log 2>&1; then
            node -e "const l=require('fs').readFileSync('tsc2.log','utf8').trim().split('\n').slice(0,30).join('\n');console.log('::error title=Site Worker typecheck::'+l.replace(/%/g,'%25').replace(/\r?\n/g,'%0A'))"
            exit 1
          fi
  build:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 in Oct 2026 and broke the Playwright install
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        brand: [trailers, vic, community-help-co, shortlisted, trade-admin, paycalc]
    env:
      BRAND: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Pay calculator maths (paycalc only)
        if: matrix.brand == 'paycalc'
        run: |
          if ! node --experimental-strip-types --no-warnings scripts/test-pay-tax.ts > paytax.log 2>&1; then
            node -e "const l=require('fs').readFileSync('paytax.log','utf8').trim().split('\\n').slice(0,30).join('\\n');console.log('::error title=Pay calculator maths::'+l.replace(/%/g,'%25').replace(/\\r?\\n/g,'%0A'))"
            exit 1
          fi
          tail -1 paytax.log | sed 's/^/::notice title=Pay calculator maths::/'
      - name: Build
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            node -e "const l=require('fs').readFileSync('build.log','utf8').trim().split('\n').slice(-40).join('\n');console.log('::error title=Build failed ('+process.env.BRAND+')::'+l.replace(/%/g,'%25').replace(/\r?\n/g,'%0A'))"
            exit 1
          fi
          grep -E "page\(s\) built" build.log | sed "s/^/::notice title=Build ($BRAND)::/" || true
      - name: Fund the Next Film concept ids match (trailers only)
        if: matrix.brand == 'trailers'
        run: |
          node -e "
            const fs=require('fs'); const ids=(f,re)=>[...fs.readFileSync(f,'utf8').matchAll(re)].map(m=>m[1]).sort().join(',');
            const w=ids('src/worker/site.ts',/\{ id: '([a-z-]+)', name:/g), p=ids('brands/trailers/site.ts',/\{ id: '([a-z-]+)', tag:/g);
            if(!w||w!==p){console.log('::error title=Fund concepts::Worker ['+w+'] vs page ['+p+'] must match');process.exit(1)}
            console.log('::notice title=Fund concepts::'+w);
            if(/amazon\.|tag=movietrailerc/i.test(fs.readFileSync('dist/fund-the-next-film.html','utf8').replace(/<footer[\s\S]*<\/footer>/,''))){console.log('::error title=Fund page::Affiliate link found on /fund-the-next-film');process.exit(1)}
          " || exit 1
      - name: Verify
        run: node scripts/verify-build.mjs
      - name: Check the Cloudflare config bundles (dry run, nothing is deployed)
        run: |
          if ! npx wrangler deploy --dry-run --outdir /tmp/wr --config brands/$BRAND/wrangler.jsonc > wr.log 2>&1; then
            node -e "const l=require('fs').readFileSync('wr.log','utf8').trim().split('\n').slice(-30).join('\n');console.log('::error title=Wrangler dry run ('+process.env.BRAND+')::'+l.replace(/%/g,'%25').replace(/\r?\n/g,'%0A'))"
            exit 1
          fi
          tail -5 wr.log
      - name: Quality gate
        run: |
          python3 scripts/quality.py dist; rc=$?
          cat quality.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Screenshots (main and preview/* branches)
        timeout-minutes: 6
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/preview/')
        continue-on-error: true
        run: |
          scripts/ci-run.sh "Install Playwright" npm install --no-save --no-audit --no-fund playwright@1
          # No browser download: screenshots.mjs uses the runner's preinstalled Chrome.
          # Pages to screenshot are listed per brand in brands/<slug>/screenshots.txt (__MOVIE__ = first movie, trailers only).
          MOVIE=$(node -e "try{console.log(require('./data/'+process.env.BRAND+'/movies.json')[0].slug)}catch{console.log('')}")
          PATHS=$(sed "s#__MOVIE__#$MOVIE#" brands/$BRAND/screenshots.txt | tr '\n' ' ')
          scripts/ci-run.sh "Take screenshots" node scripts/screenshots.mjs $PATHS
          cd screenshots
          git init -q -b shots
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Screenshots for ${GITHUB_SHA}"
          ../scripts/ci-run.sh "Push screenshots" git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" shots:refs/heads/screenshots-$BRAND
