# Builds every brand and verifies the output on each push.
# Cloudflare does the real deploys; this is the safety net.
# Results are written as annotations so they're readable without the raw logs.
name: Check build
permissions:
  contents: write
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        brand: [trailers]
    env:
      BRAND: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            node -e "const l=require('fs').readFileSync('build.log','utf8').trim().split('\n').slice(-40).join('\n');console.log('::error title=Build failed ('+process.env.BRAND+')::'+l.replace(/%/g,'%25').replace(/\r?\n/g,'%0A'))"
            exit 1
          fi
          grep -E "page\(s\) built" build.log | sed "s/^/::notice title=Build ($BRAND)::/" || true
      - name: Verify
        run: node scripts/verify-build.mjs
      - name: Screenshots (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          node scripts/screenshots.mjs / /browse /discover /discover/marvel-cinematic-universe /movies/$(node -e "console.log(require('./data/'+process.env.BRAND+'/movies.json')[0].slug)") /about /does-not-exist
          cd screenshots
          git init -q -b screenshots
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots:screenshots-$BRAND
