# Vic Tours: pull free OpenStreetMap data for the next most-searched places and commit it.
name: vic-probe
on:
  workflow_dispatch:
    inputs:
      count:
        description: How many places to probe
        default: '15'
      slugs:
        description: Optional comma-separated town slugs to probe instead (e.g. halls-gap,lorne)
        default: ''
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 in Oct 2026 and broke the Playwright install
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Probe OpenStreetMap
        run: python3 scripts/vic/osm_probe.py "${{ inputs.count }}" "${{ inputs.slugs }}"
        timeout-minutes: 100
      - name: Rebuild the site snapshot (published towns only)
        if: always()
        run: python3 scripts/vic/build_data.py
      - name: Commit (also after a timeout, so finished towns are kept)
        if: always()
        run: |
          git config user.name "Vic Tours probe" && git config user.email "pipeline@victours.com.au"
          git add data/vic
          git diff --cached --quiet && exit 0
          git commit -qm "Vic Tours: OpenStreetMap probe [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done; exit 1
