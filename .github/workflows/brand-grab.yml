# Find a business's logo and brand colours from its own website, for an IMN preview (imn-preview skill). Prints only; writes nothing.
name: brand-grab
on:
  workflow_dispatch:
    inputs:
      url:
        description: The business's own website (e.g. https://example.com.au)
        required: true
jobs:
  grab:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 in Oct 2026 and broke the Playwright install
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts/imn }
      - run: pip install --quiet pillow
      - env: { URL: "${{ inputs.url }}" }
        run: python3 scripts/imn/brand_grab.py "$URL"
