# Read-only Google search volumes for chat sessions (scripts/claude/volumes.sh). ~US$0.09 per run from DataForSEO credit.
name: lookup
on:
  workflow_dispatch:
    inputs:
      keywords:
        description: Keywords separated by |
        required: true
      location:
        description: Google Ads location code (2840 US, 2036 Australia)
        default: '2840'
jobs:
  volumes:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 in Oct 2026 and broke the Playwright install
    timeout-minutes: 5
    steps:
      - env:
          KEY: ${{ secrets.PIPELINE_RUN_KEY }}
          KW: ${{ inputs.keywords }}
          LOC: ${{ inputs.location }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          q = urllib.parse.urlencode({'key': os.environ['KEY'], 'kw': os.environ['KW'], 'loc': os.environ['LOC']})
          try:
              d = json.load(urllib.request.urlopen(urllib.request.Request(f'https://trailer-pipeline.simonpatrickfarrugia.workers.dev/lookup/volumes?{q}', headers={'user-agent': 'site-factory-lookup/1'}), timeout=120))
          except urllib.error.HTTPError as e:
              d = {'error': f'HTTP {e.code}: ' + e.read().decode()[:300]}
          except Exception as e:
              d = {'error': repr(e)[:300]}
          if 'error' in d: print('::error title=lookup::' + d['error'].replace('\n', ' ')); raise SystemExit(1)
          rows = sorted(d['volumes'].items(), key=lambda kv: -(kv[1] or -1))
          out = '\n'.join(f'{v if v is not None else "-"}\t{k}' for k, v in rows)
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('```\n' + out + '\n```\n')
          print('::notice title=lookup::' + out.replace('%', '%25').replace('\n', '%0A')[:60000])
          PY
