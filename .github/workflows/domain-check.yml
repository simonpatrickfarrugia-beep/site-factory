# Check which domain names are unregistered (RDAP). Claude runs this from chat when shortlisting names.
name: domain-check
on:
  workflow_dispatch:
    inputs:
      names:
        description: Comma-separated domain names
        required: true
jobs:
  check:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 in Oct 2026 and broke the Playwright install
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/domain_check.py "${{ inputs.names }}" && cat domains.md >> "$GITHUB_STEP_SUMMARY"
