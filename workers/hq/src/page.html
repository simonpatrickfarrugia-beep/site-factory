<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>IMN HQ Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar (brand chips + tabs), summary strip, then one working view: board columns, prospect list or replies. */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --sunk:#E9E6DF; --fg:#1D1F22; --muted:#666A70; --line:#DAD6CD;
  --accent:#2F4AD0; --accent-ink:#FFFFFF; --due:#B5530F; --due-bg:#FCEBDD; --good:#1E7A4C; --good-bg:#E1F2E8; --bad:#9A2F2F;
  --display:"Bricolage Grotesque",Georgia,serif; --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --vic:#00653B; --community-help-co:#1F6F5B; --trade-admin:#E8641B; --trailers:#C68A12; --paycalc:#152B4D;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171A; --surface:#1E2125; --sunk:#26292E; --fg:#ECEDEF; --muted:#A1A6AD; --line:#33373D;
  --accent:#8EA2FF; --accent-ink:#0E1330; --due:#F4A261; --due-bg:#3A2716; --good:#7FD8A6; --good-bg:#16301F; --bad:#F08A8A;
  --vic:#4FBF86; --community-help-co:#5FC7A8; --trade-admin:#F2924F; --trailers:#F2B53A; --paycalc:#8FB0E8; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px 10px}
h1{font:700 1.35rem/1 var(--display);margin:0;letter-spacing:-.01em}
h1 small{font:500 .78rem var(--mono);color:var(--muted);margin-left:8px;letter-spacing:0}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:9px;margin-left:auto}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;display:flex;align-items:center;gap:7px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--muted))}
.chip .paused{font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"] .paused{color:inherit;opacity:.7}
main{padding-block:16px 48px;display:grid;gap:18px}
main>*{min-width:0}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.stat b{display:block;font:500 1.6rem/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.stat.due b{color:var(--due)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.col{scroll-snap-align:start;background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px;min-width:0}
.col h2{font:600 .78rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 4px 2px;display:flex;justify-content:space-between}
.col h2 em{font:500 .78rem var(--mono);font-style:normal}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:9px;padding:10px 12px;text-align:left;width:100%;display:grid;gap:3px;min-width:0}
.card:hover{border-color:var(--muted);border-left-color:var(--c)}
.card .name{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card .meta{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.card .last{font-size:.82rem;overflow-wrap:anywhere}
.pill{display:inline-block;font:600 .72rem var(--body);padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);justify-self:start}
.pill.due{background:var(--due-bg);color:var(--due)}
.pill.good{background:var(--good-bg);color:var(--good)}
.empty{color:var(--muted);font-size:.85rem;padding:8px 6px}
.hint{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px 18px;color:var(--muted);max-width:70ch}
.hint strong{color:var(--fg)}
/* Prospect view */
.pgrid{display:grid;gap:16px}
.pbrand{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.phead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--line);border-top:4px solid var(--c)}
.phead h2{font:700 1.15rem var(--display);margin:0}
.phead .sub{color:var(--muted);font-size:.86rem}
.phead .cap{margin-left:auto;font:500 .85rem var(--mono);font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;width:120px;display:inline-block;vertical-align:middle;margin-left:8px}
.meter i{display:block;height:100%;background:var(--c)}
.plist{list-style:none;margin:0;padding:0}
.prow{display:grid;grid-template-columns:52px 1fr auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.prow:first-child{border-top:0}
.score{font:500 1.05rem var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
.score small{display:block;font-size:.68rem;color:var(--muted)}
.ptitle{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ptitle span{color:var(--muted);font-weight:400}
.pwhy{font-size:.82rem;color:var(--muted);grid-column:2/4;overflow-wrap:anywhere}
.poffer{font-size:.86rem;grid-column:2/4;overflow-wrap:anywhere}
.pq{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px}
.pq a{font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--fg);text-decoration:none;background:var(--bg)}
.pq a:hover{border-color:var(--muted)}
.more{width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px;color:var(--accent);font-weight:600}
/* Replies */
.rlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rlist li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:baseline}
.rlist li:first-child{border-top:0}
.rlist .who{font-weight:600;overflow-wrap:anywhere;min-width:0}
.rlist .subj{grid-column:2/4;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.rlist time{font:500 .78rem var(--mono);color:var(--muted)}
/* Detail sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--fg);width:min(560px,100%);max-height:100dvh;margin:0 0 0 auto;height:100dvh;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(10,12,16,.4)}
.sheet{display:grid;gap:16px;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.sheet header{display:flex;gap:12px;align-items:start}
.sheet h2{font:700 1.3rem/1.2 var(--display);margin:0;overflow-wrap:anywhere}
.sheet .close{margin-left:auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere;min-width:0}
.kv a{color:var(--accent)}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stages button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 11px;font-weight:600;font-size:.88rem}
.stages button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
label{font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
textarea,input[type=text]{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:.88rem}
.timeline time{font:500 .76rem var(--mono);color:var(--muted);padding-top:2px}
.timeline .t-body{min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:20}
.error{color:var(--bad)}
/* Draft sheet */
.why{background:var(--sunk);border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:.88rem}
.why b{font-weight:600}
.why .pq{grid-column:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field input,.field select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mail{display:grid;gap:8px}
.mail textarea{min-height:300px;font:14px/1.5 var(--body)}
.preview{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.9rem;max-height:340px;overflow:auto;overflow-wrap:anywhere}
.from{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--due-bg);color:var(--due);border-radius:8px;padding:8px 12px;font-size:.88rem;font-weight:600}
.btn.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.vers{display:flex;flex-wrap:wrap;gap:6px}
.vers button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:.82rem}
.vers button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.draft-btn{grid-column:2/4;justify-self:start;border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.86rem}
/* Replies body */
.rbody{grid-column:2/4;white-space:pre-wrap;font-size:.9rem;overflow-wrap:anywhere;border-left:3px solid var(--line);padding-left:10px;margin-top:4px}
.rbody.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rmore{grid-column:2/4;justify-self:start;border:0;background:none;color:var(--accent);padding:0;font-weight:600;font-size:.84rem}
/* Pipeline */
.fun{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;border-top:4px solid var(--c)}
.fun h2{font:700 1.1rem var(--display);margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fun h2 span{font:400 .84rem var(--body);color:var(--muted)}
.steps{display:grid;gap:6px}
.step{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;align-items:center;font-size:.86rem}
.step .fbar{height:22px;background:var(--sunk);border-radius:5px;overflow:hidden;display:block}
.step .fbar i{display:block;height:100%;background:var(--c);opacity:.85;min-width:2px}
.step .n{font:500 .86rem var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.step .n small{color:var(--muted)}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;border-top:0;white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec h2{font:700 1.15rem var(--display);margin:6px 0 10px}
.spark{display:block;width:120px;height:28px}
.delta{font-family:var(--mono);font-size:.8rem}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
/* Affiliates */
.agroup{display:grid;gap:8px}
.agroup h2{font:700 1.05rem var(--display);margin:4px 0 0;display:flex;gap:8px;align-items:baseline}
.agroup h2 em{font:500 .8rem var(--mono);font-style:normal;color:var(--muted)}
.alist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.arow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.alist li:first-child .arow{border-top:0}
.arow:hover{background:var(--bg)}
.arow .an{font-weight:600;overflow-wrap:anywhere;min-width:0}
.arow .am{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere;min-width:0}
.arow .ar{text-align:right;display:grid;gap:4px;justify-items:end;align-content:start}
.dots{display:inline-flex;gap:4px;margin-right:6px;vertical-align:middle}
.st-approved{background:var(--good-bg);color:var(--good)}
.st-applied{background:var(--sunk);color:var(--fg)}
.st-rejected,.st-paused{background:var(--sunk);color:var(--muted)}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
details.ideas summary{cursor:pointer;font:700 1.05rem var(--display);padding:4px 0}
@media (max-width:640px){
  .tabs{margin-left:0;width:100%}
  .tabs button{flex:1}
  .board{grid-auto-columns:86%}
  .prow{grid-template-columns:44px 1fr}
  .prow .pill{grid-column:2}
  .pwhy,.poffer,.pq{grid-column:2}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:4px}
  .grid2{grid-template-columns:1fr}
  .draft-btn,.rbody,.rmore{grid-column:2}
  .step{grid-template-columns:64px 1fr 76px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="bar">
    <h1>IMN HQ <small id="updated">Outreach</small></h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-board" aria-selected="true" data-view="board">Board</button>
      <button role="tab" id="tab-prospect" aria-selected="false" data-view="prospect">Prospect</button>
      <button role="tab" id="tab-pipeline" aria-selected="false" data-view="pipeline">Pipeline</button>
      <button role="tab" id="tab-replies" aria-selected="false" data-view="replies">Replies</button>
      <button role="tab" id="tab-affiliates" aria-selected="false" data-view="affiliates">Affiliates</button>
    </div>
  </div>
  <div class="chips" id="chips" aria-label="Filter by brand"></div>
</div></div>

<main class="wrap">
  <section class="strip" id="strip" aria-label="This week"></section>
  <section id="view"></section>
</main>

<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet" id="sheet-body"></div></dialog>

<script>
const STAGE_LABEL = { found: 'Found', drafted: 'Drafted', sent: 'Sent', replied: 'Replied', linked: 'Linked', won: 'Won', no: 'No' };
const state = { view: 'board', brand: 'all', board: null, summary: null, prospects: null, replies: null, pipeline: null, affiliates: null, showAll: {}, open: {} };
try { const s = JSON.parse(localStorage.getItem('imn-hq') || '{}'); if (s.view) state.view = s.view; if (s.brand) state.brand = s.brand; } catch (e) {}
const save = () => { try { localStorage.setItem('imn-hq', JSON.stringify({ view: state.view, brand: state.brand })); } catch (e) {} };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const color = (b) => `var(--${b})`;
const brandName = (b) => (state.board?.brands.find((x) => x.key === b)?.name) || b;
const ago = (iso) => {
  if (!iso) return '';
  const d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
  if (d <= 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 14) return d + ' days ago';
  return new Date(iso).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
};
const short = (iso) => new Date(iso).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({ error: 'The server sent something unexpected. Refresh and try again.' }));
  if (!res.ok || data.error) throw new Error(data.error || 'Request failed (' + res.status + ')');
  return data;
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

async function load() {
  try {
    const [board, summary, prospects, replies, pipeline, affiliates] = await Promise.all([api('/api/board'), api('/api/summary'), api('/api/prospects'), api('/api/replies'), api('/api/pipeline'), api('/api/affiliates')]);
    Object.assign(state, { board, summary, prospects, replies, pipeline, affiliates });
    $('#updated').textContent = 'Targets scored ' + new Date(prospects.generated).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
    render();
  } catch (e) {
    $('#view').innerHTML = '<p class="error">' + esc(e.message) + '</p>';
  }
}

function render() {
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === state.view)));
  renderChips(); renderStrip();
  if (state.view === 'board') renderBoard();
  else if (state.view === 'prospect') renderProspect();
  else if (state.view === 'pipeline') renderPipeline();
  else if (state.view === 'affiliates') renderAffiliates();
  else renderReplies();
}

function renderChips() {
  const brands = state.board.brands;
  const counts = {};
  state.board.orgs.forEach((o) => { counts[o.brand] = (counts[o.brand] || 0) + 1; });
  $('#chips').innerHTML = [`<button class="chip" aria-pressed="${state.brand === 'all'}" data-brand="all">All brands</button>`]
    .concat(brands.map((b) => `<button class="chip" style="--c:${color(b.key)}" aria-pressed="${state.brand === b.key}" data-brand="${b.key}"><i class="dot"></i>${esc(b.name)}${b.active ? '' : ' <span class="paused">paused</span>'}</button>`)).join('');
}

function inBrand(b) { return state.brand === 'all' || state.brand === b; }

function renderStrip() {
  if (state.view === 'affiliates') {
    const items = affItems();
    const c = (f) => items.filter(f).length;
    $('#strip').innerHTML = `
      <div class="stat"><b>${c((i) => i.status === 'approved')}</b><span>Approved${c((i) => i.notWired) ? ' (' + c((i) => i.notWired) + ' not live yet)' : ''}</span></div>
      <div class="stat"><b>${c((i) => i.status === 'applied')}</b><span>Applied, waiting</span></div>
      <div class="stat${c((i) => i.chase) ? ' due' : ''}"><b>${c((i) => i.chase)}</b><span>To chase (14+ days or follow-up due)</span></div>
      <div class="stat"><b>${c((i) => i.status === 'not-applied' && !i.brandList.includes('ideas'))}</b><span>Not applied yet</span></div>`;
    return;
  }
  const s = state.summary; const keys = Object.keys(s).filter(inBrand);
  const sum = (f) => keys.reduce((a, k) => a + (s[k][f] || 0), 0);
  const contacted = sum('contacted'); const answered = keys.reduce((a, k) => a + (s[k].byStage.replied || 0) + (s[k].byStage.linked || 0) + (s[k].byStage.won || 0) + (s[k].byStage.no || 0), 0);
  const rate = contacted ? Math.round((100 * answered) / contacted) + '%' : '–';
  const due = sum('followUps');
  $('#strip').innerHTML = `
    <div class="stat"><b>${sum('sentWeek')}</b><span>Sent this week</span></div>
    <div class="stat"><b>${rate}</b><span>Reply rate (${contacted} contacted)</span></div>
    <div class="stat"><b>${sum('links')}</b><span>Links won</span></div>
    <div class="stat${due ? ' due' : ''}"><b>${due}</b><span>Follow-ups due (7+ days)</span></div>`;
}

const AFF_LABEL = { 'not-applied': 'Not applied', applied: 'Applied', approved: 'Approved', rejected: 'Rejected', paused: 'Paused' };

  return (state.affiliates?.items || []).filter((i) => state.brand === 'all' || i.brandList.includes(state.brand));

function affRow(i) {
  const brands = i.brandList.filter((b) => b !== 'ideas').map((b) => `<i class="dot" style="--c:${color(b)}" title="${esc(brandName(b))}"></i>`).join('');

    ? `${i.chase ? '<span class="pill due">Chase</span>' : ''}<span class="meta">${i.waiting !== null ? i.waiting + ' days waiting' : 'date not recorded'}</span>`

    </div>
    ${f('next_step', 'Next step', 'e.g. Chase by email if no reply by Friday')}
    <div class="field"><label for="a-note">Notes</label><textarea id="a-note">${esc(a.note || '')}</textarea></div>
    ${id ? `<div class="field"><label for="a-event">Add to history (optional)</label><input id="a-event" type="text" placeholder="e.g. Emailed support to chase"></div>` : ''}
    <div class="row"><button class="btn" id="a-save">${id ? 'Save' : 'Add programme'}</button>${a.signup_url ? `<a class="btn ghost" style="text-decoration:none" href="${esc(a.signup_url)}" target="_blank" rel="noopener">Open programme ↗</a>` : ''}</div>
    ${id ? `<div><label>History</label><ul class="timeline" style="margin-top:8px">${events.map((e) => `<li><time>${esc(short(e.at))}</time><span class="t-body"><strong>${esc(AFF_LABEL[e.status] || e.status || '')}</strong>${e.note ? ' · ' + esc(e.note) : ''}</span></li>`).join('')}</ul></div>` : ''}`;
  let status = a.status;
  const brands = new Set(sel.filter(Boolean));
  $('#close').onclick = () => dlg.close();
  body.querySelectorAll('[data-ast]').forEach((b) => b.onclick = () => { status = b.dataset.ast; body.querySelectorAll('[data-ast]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.ast === status))); });
  body.querySelectorAll('[data-abr]').forEach((b) => b.onclick = () => { const k = b.dataset.abr; brands.has(k) ? brands.delete(k) : brands.add(k); b.setAttribute('aria-pressed', String(brands.has(k))); });
  $('#a-save').onclick = async () => {
    const v = (k) => $('#a-' + k) ? $('#a-' + k).value : undefined;
    const payload = { status, brands: [...brands].join(','), network: v('network'), commission: v('commission'), ids: v('ids'), signup_url: v('signup_url'), live: v('live'), follow_up_at: v('follow_up_at'), next_step: v('next_step'), note: v('note') };
    if (v('applied_at') !== (a.applied_at || '').slice(0, 10)) payload.applied_at = v('applied_at');
    if (v('decided_at') !== (a.decided_at || '').slice(0, 10)) payload.decided_at = v('decided_at');
    if (!id) payload.name = v('name');
    if (id && v('event')) payload.event_note = v('event');
    try {
      const r = await api('/api/affiliates' + (id ? '/' + encodeURIComponent(id) : ''), payload);
      toast(id ? 'Saved' : 'Added');
      state.affiliates = await api('/api/affiliates'); render(); openAffiliate(r.id);
    } catch (e) { toast(e.message); }
  };
}

// ---------- Pipeline ----------
function spark(series) {
  if (!series || series.length < 2) return '';
  const max = Math.max(1, ...series.map((p) => p.impressions));
  const pts = series.map((p, i) => `${(i / (series.length - 1)) * 116 + 2},${26 - (p.impressions / max) * 22}`).join(' ');
  return `<svg class="spark" viewBox="0 0 120 28" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
}
function delta(now, then) {
  if (then === null || then === undefined) return '';
  const d = now - then;
  return `<span class="delta ${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '+' : ''}${d}</span>`;
}
function renderPipeline() {
  const p = state.pipeline;
  const fun = p.funnel.filter((f) => inBrand(f.key));
  const funHtml = fun.map((f) => {
    const top = Math.max(1, f.steps[0].count);
    return `<article class="fun" style="--c:${color(f.key)}"><h2>${esc(f.name)} <span>${f.total} organisations · ${f.won} won · ${f.no} said no</span></h2>
      <div class="steps">${f.steps.map((s, i) => {
        const prev = i ? f.steps[i - 1].count : null;
        const conv = prev ? Math.round((100 * s.count) / prev) + '%' : '';
        return `<div class="step"><span>${STAGE_LABEL[s.stage]}</span><span class="fbar"><i style="width:${(100 * s.count) / top}%"></i></span><span class="n">${s.count}${conv ? ` <small>${conv}</small>` : ''}</span></div>`;
      }).join('')}</div></article>`;
  }).join('');
  const tpls = p.templates.filter((t) => inBrand(t.brand));
  const tplHtml = tpls.length ? `<div class="tbl"><table><thead><tr><th>Brand · segment</th><th>Version</th><th class="num">Orgs</th><th class="num">Sent</th><th class="num">Replied</th><th class="num">Linked</th></tr></thead><tbody>${tpls.map((t) => `
    <tr><td>${esc(brandName(t.brand))} · ${esc(t.segmentLabel)}</td><td>v${t.version}${t.note ? ` <span class="meta">${esc(t.note)}</span>` : ''}</td><td class="num">${t.orgs}</td><td class="num">${t.sent}</td><td class="num">${t.replied}${t.replyRate !== null ? ` (${t.replyRate}%)` : ''}</td><td class="num">${t.linked}${t.linkRate !== null ? ` (${t.linkRate}%)` : ''}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="hint">Template results show here once emails go out. Each version is tracked separately, so you can see which wording gets replies.</div>';
  const links = p.links.filter((l) => inBrand(l.brand));
  const linkHtml = links.length ? `<div class="tbl"><table><thead><tr><th>Organisation</th><th>Links to</th><th>Since</th><th class="num">Views 28d</th><th class="num">Impr. 28d</th><th class="num">Clicks 28d</th><th>Trend</th></tr></thead><tbody>${links.map((l) => `
    <tr><td><button data-org="${l.org_id}" style="border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left">${esc(l.org_name)}</button><div class="meta"><a href="${esc(l.page_url)}" target="_blank" rel="noopener">their page ↗</a></div></td>
    <td><a href="${esc(l.our_url)}" target="_blank" rel="noopener">${esc(l.our_url.replace(/^https?:\/\/(www\.)?/, ''))}</a></td>
    <td>${esc(ago(l.first_seen))}</td>
    <td class="num">${l.now.views} ${delta(l.now.views, l.atLink?.views)}</td>
    <td class="num">${l.now.impressions} ${delta(l.now.impressions, l.atLink?.impressions)}</td>
    <td class="num">${l.now.clicks} ${delta(l.now.clicks, l.atLink?.clicks)}</td>
    <td>${spark(l.series)}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="hint"><strong>No links won yet.</strong> Every morning IMN HQ visits the page you noted for each contacted organisation. When your link appears, the card moves to Linked and the page you were linked from shows here with its views, Google impressions and clicks, and the change since the link went up.</div>';
  $('#view').innerHTML = `<div class="cards2">${funHtml}</div>
    <section class="sec"><h2>Links won and page performance</h2>${linkHtml}</section>
    <section class="sec"><h2>Template performance</h2>${tplHtml}</section>`;
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.view) { state.view = t.dataset.view; save(); render(); }
  else if (t.dataset.brand) { state.brand = t.dataset.brand; save(); render(); }
  else if (t.dataset.org) openOrg(Number(t.dataset.org));
  else if (t.dataset.more) { state.showAll[t.dataset.more] = !state.showAll[t.dataset.more]; renderProspect(); }
  else if (t.dataset.draft) { const [b, k] = t.dataset.draft.split('|'); openDraft(b, k); }
  else if (t.dataset.aff) openAffiliate(t.dataset.aff);
  else if (t.dataset.expand) { state.open[t.dataset.expand] = !state.open[t.dataset.expand]; renderReplies(); }
});
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') e.target.close(); });
load();
setInterval(() => { if (!$('#sheet').open && document.visibilityState === 'visible') load(); }, 60000);
</script>
</body>
