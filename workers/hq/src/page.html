<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IMN HQ">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<title>IMN HQ Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar (brand chips + tabs), summary strip, then one working view: board columns, prospect list or replies. */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --sunk:#E9E6DF; --fg:#1D1F22; --muted:#666A70; --line:#DAD6CD;
  --accent:#2F4AD0; --accent-ink:#FFFFFF; --due:#B5530F; --due-bg:#FCEBDD; --good:#1E7A4C; --good-bg:#E1F2E8; --bad:#9A2F2F;
  --display:"Bricolage Grotesque",Georgia,serif; --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --vic:#00653B; --community-help-co:#1F6F5B; --trade-admin:#E8641B; --trailers:#C68A12; --paycalc:#152B4D; --backyard-wild:#5B7F2A; --simon-says-travel:#7A4FB5;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171A; --surface:#1E2125; --sunk:#26292E; --fg:#ECEDEF; --muted:#A1A6AD; --line:#33373D;
  --accent:#8EA2FF; --accent-ink:#0E1330; --due:#F4A261; --due-bg:#3A2716; --good:#7FD8A6; --good-bg:#16301F; --bad:#F08A8A;
  --vic:#4FBF86; --community-help-co:#5FC7A8; --trade-admin:#F2924F; --trailers:#F2B53A; --paycalc:#8FB0E8; --backyard-wild:#9CCB5E; --simon-says-travel:#B79BEA; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px 10px}
h1{font:700 1.35rem/1 var(--display);margin:0;letter-spacing:-.01em}
h1 small{font:500 .78rem var(--mono);color:var(--muted);margin-left:8px;letter-spacing:0}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:9px;margin-left:auto}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;display:flex;align-items:center;gap:7px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--muted))}
.chip .paused{font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"] .paused{color:inherit;opacity:.7}
main{padding-block:16px 48px;display:grid;gap:18px}
main>*{min-width:0}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.stat b{display:block;font:500 1.6rem/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.stat.due b{color:var(--due)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.col{scroll-snap-align:start;background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px;min-width:0}
.col h2{font:600 .78rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 4px 2px;display:flex;justify-content:space-between}
.col h2 em{font:500 .78rem var(--mono);font-style:normal}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:9px;padding:10px 12px;text-align:left;width:100%;display:grid;gap:3px;min-width:0}
.card:hover{border-color:var(--muted);border-left-color:var(--c)}
.card .name{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card .meta{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.card .last{font-size:.82rem;overflow-wrap:anywhere}
.pill{display:inline-block;font:600 .72rem var(--body);padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);justify-self:start}
.pill.due{background:var(--due-bg);color:var(--due)}
.pill.good{background:var(--good-bg);color:var(--good)}
.empty{color:var(--muted);font-size:.85rem;padding:8px 6px}
.hint{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px 18px;color:var(--muted);max-width:70ch}
.hint strong{color:var(--fg)}
/* Prospect view */
.pgrid{display:grid;gap:16px}
.pbrand{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.phead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--line);border-top:4px solid var(--c)}
.phead h2{font:700 1.15rem var(--display);margin:0}
.phead .sub{color:var(--muted);font-size:.86rem}
.phead .cap{margin-left:auto;font:500 .85rem var(--mono);font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;width:120px;display:inline-block;vertical-align:middle;margin-left:8px}
.meter i{display:block;height:100%;background:var(--c)}
.plist{list-style:none;margin:0;padding:0}
.prow{display:grid;grid-template-columns:52px 1fr auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.prow:first-child{border-top:0}
.score{font:500 1.05rem var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
.score small{display:block;font-size:.68rem;color:var(--muted)}
.ptitle{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ptitle span{color:var(--muted);font-weight:400}
.pwhy{font-size:.82rem;color:var(--muted);grid-column:2/4;overflow-wrap:anywhere}
.poffer{font-size:.86rem;grid-column:2/4;overflow-wrap:anywhere}
.pq{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px}
.pq a{font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--fg);text-decoration:none;background:var(--bg)}
.pq a:hover{border-color:var(--muted)}
.more{width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px;color:var(--accent);font-weight:600}
/* Replies */
.rlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rlist li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:baseline}
.rlist li:first-child{border-top:0}
.rlist .who{font-weight:600;overflow-wrap:anywhere;min-width:0}
.rlist .subj{grid-column:2/4;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.rlist time{font:500 .78rem var(--mono);color:var(--muted)}
/* Detail sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--fg);width:min(560px,100%);max-height:100dvh;margin:0 0 0 auto;height:100dvh;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(10,12,16,.4)}
.sheet{display:grid;gap:16px;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.sheet header{display:flex;gap:12px;align-items:start}
.sheet h2{font:700 1.3rem/1.2 var(--display);margin:0;overflow-wrap:anywhere}
.sheet .close{margin-left:auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere;min-width:0}
.kv a{color:var(--accent)}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stages button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 11px;font-weight:600;font-size:.88rem}
.stages button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
label{font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
textarea,input[type=text]{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:.88rem}
.timeline time{font:500 .76rem var(--mono);color:var(--muted);padding-top:2px}
.timeline .t-body{min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:20}
.error{color:var(--bad)}
/* Draft sheet */
.why{background:var(--sunk);border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:.88rem}
.why b{font-weight:600}
.why .pq{grid-column:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field input,.field select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mail{display:grid;gap:8px}
.mail textarea{min-height:300px;font:14px/1.5 var(--body)}
.phone-only{display:none}@media (max-width:640px){.phone-only{display:block}}
.copy-bar{flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}.copy-bar .btn{padding:6px 10px}
.card-wrap{display:grid;gap:4px;margin-bottom:8px}.card-wrap .card{margin-bottom:0}.retry{justify-self:start;padding:6px 12px;font-size:.9rem}
.preview{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.9rem;max-height:340px;overflow:auto;overflow-wrap:anywhere}
.from{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--due-bg);color:var(--due);border-radius:8px;padding:8px 12px;font-size:.88rem;font-weight:600}
.btn.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.vers{display:flex;flex-wrap:wrap;gap:6px}
.vers button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:.82rem}
.vers button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.draft-btn{grid-column:2/4;justify-self:start;border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.86rem}
/* Replies body */
.rbody{grid-column:2/4;white-space:pre-wrap;font-size:.9rem;overflow-wrap:anywhere;border-left:3px solid var(--line);padding-left:10px;margin-top:4px}
.rbody.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rmore{grid-column:2/4;justify-self:start;border:0;background:none;color:var(--accent);padding:0;font-weight:600;font-size:.84rem}
/* Pipeline */
.fun{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;border-top:4px solid var(--c)}
.fun h2{font:700 1.1rem var(--display);margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fun h2 span{font:400 .84rem var(--body);color:var(--muted)}
.steps{display:grid;gap:6px}
.step{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;align-items:center;font-size:.86rem}
.step .fbar{height:22px;background:var(--sunk);border-radius:5px;overflow:hidden;display:block}
.step .fbar i{display:block;height:100%;background:var(--c);opacity:.85;min-width:2px}
.step .n{font:500 .86rem var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.step .n small{color:var(--muted)}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;border-top:0;white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec h2{font:700 1.15rem var(--display);margin:6px 0 10px}
.spark{display:block;width:120px;height:28px}
.delta{font-family:var(--mono);font-size:.8rem}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
/* Affiliates */
.agroup{display:grid;gap:8px}
.agroup h2{font:700 1.05rem var(--display);margin:4px 0 0;display:flex;gap:8px;align-items:baseline}
.agroup h2 em{font:500 .8rem var(--mono);font-style:normal;color:var(--muted)}
.alist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.arow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.alist li:first-child .arow{border-top:0}
.arow:hover{background:var(--bg)}
.arow .an{font-weight:600;overflow-wrap:anywhere;min-width:0}
.arow .am{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere;min-width:0}
.arow .ar{text-align:right;display:grid;gap:4px;justify-items:end;align-content:start}
.dots{display:inline-flex;gap:4px;margin-right:6px;vertical-align:middle}
.st-approved{background:var(--good-bg);color:var(--good)}
.st-applied{background:var(--sunk);color:var(--fg)}
.st-rejected,.st-paused{background:var(--sunk);color:var(--muted)}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
details.ideas summary{cursor:pointer;font:700 1.05rem var(--display);padding:4px 0}
/* Today (Radar) */
.today-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.today-head h2{font:700 1.25rem var(--display);margin:0}
.today-head .meta{font-size:.86rem;color:var(--muted)}
.rlist2{display:grid;gap:14px}
.pgrid>*,.rlist2>*,.rtop>*{min-width:0}
.drop{min-width:0;max-width:100%}
.rcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:16px;display:grid;gap:10px;min-width:0}
.rtop{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.rscore{font:500 1.25rem var(--mono);width:54px;height:54px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);line-height:1;text-align:center}
.rscore small{display:block;font:600 .58rem var(--body);letter-spacing:.1em;color:var(--muted);margin-top:3px}
.rtop h3{font:700 1.2rem/1.2 var(--display);margin:0;overflow-wrap:anywhere}
.rtop .meta{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.rwhy{border-left:3px solid var(--c);padding-left:10px;margin:0;font-size:.92rem}
.rwhy b{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin:0}.rchips span{font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.rnow{font-size:.92rem;margin:0}.rnow b{color:var(--c)}
.rkv{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;font-size:.88rem;margin:0}
.rkv dt{color:var(--muted)}
.rkv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ractions{display:flex;flex-wrap:wrap;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.ractions .btn{padding:7px 12px;font-size:.88rem}
.drop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.drop select,.drop input{font:inherit;font-size:.86rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.learn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.learn h3{font:700 1.05rem var(--display);margin:0}
.learn ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}
.learn .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.learn h4{margin:0 0 4px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rule{display:flex;justify-content:space-between;gap:10px;align-items:center}
@media (max-width:640px){
  .tabs{margin-left:0;width:100%;flex:1 1 100%;min-width:0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;padding:6px 10px}
  .drop input{min-width:0!important}
  .board{grid-auto-columns:86%}
  .prow{grid-template-columns:44px 1fr}
  .prow .pill{grid-column:2}
  .pwhy,.poffer,.pq{grid-column:2}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:4px}
  .grid2{grid-template-columns:1fr}
  .learn .two{grid-template-columns:1fr}
  .rkv{grid-template-columns:1fr}
  .draft-btn,.rbody,.rmore{grid-column:2}
  .step{grid-template-columns:64px 1fr 76px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
/* ---------- Phone layout ---------- */
.more-menu{display:none}
.rcard .rbody,.rcard .rmore{grid-column:auto}
.fcheck{display:flex;gap:10px;align-items:flex-start;background:var(--good-bg);border-radius:10px;padding:10px 12px;font-size:.88rem}
.fcheck input{margin-top:3px;width:18px;height:18px;flex:none}
.fcheck b{font-weight:600}
.tri{display:inline-block;font:600 .7rem var(--body);padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:middle}
.tri.positive{background:var(--good-bg);color:var(--good)}.tri.optout{background:var(--due-bg);color:var(--due)}
.needs h2{font:700 1.05rem var(--display);margin:6px 0 8px;display:flex;gap:8px;align-items:baseline}
.needs h2 em{font:500 .8rem var(--mono);font-style:normal;color:var(--muted)}
.needs .card{margin-bottom:8px}
@media (max-width:640px){
  body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .top{position:static}
  .bar{padding-block:10px 6px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;width:auto;border-radius:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;overflow:visible}
  .tabs button{padding:10px 4px;font-size:.9rem;border-radius:10px}
  .tabs button[data-desk]{display:none}
  .tabs button[aria-selected="true"]{background:var(--sunk);box-shadow:none}
  .more-menu{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:16;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:grid;gap:2px;min-width:180px}
  .more-menu[hidden]{display:none}
  .more-menu button{border:0;background:none;text-align:left;padding:12px 14px;border-radius:8px;font-weight:600}
  .more-menu button:hover{background:var(--sunk)}
  .strip{grid-template-columns:repeat(4,1fr);gap:6px}
  .stat{padding:8px 8px}
  .stat b{font-size:1.15rem}
  .stat span{font-size:.68rem;line-height:1.2;display:block}
  main{padding-block:10px 24px;gap:12px}
  .ractions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .ractions .drop{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:8px}
  .ractions .drop select{grid-column:1/-1;padding:10px}
  .ractions .drop input{padding:10px}
  .ractions [data-rlater]{grid-column:1/-1}
  .desk-only{display:none!important}
  .go-bar{position:sticky;bottom:0;background:var(--surface);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
  .go-bar .btn{flex:1;padding:14px;font-size:1rem}
  details.fold summary{cursor:pointer;font-weight:600;padding:6px 0}
}
@media (min-width:641px){ .mob-only{display:none!important} }

/* Funnel tab */
.hqf{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px}
.hqf__label{font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 2px}

.chev{list-style:none;padding:0;margin:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.chev li{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 14px 10px;min-width:0;background:var(--sunk);color:var(--muted);
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.chev li:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:8px 0 0 8px}

.chev.sm li{padding:7px 10px 6px}

.chev.sm span{font-size:.66rem}
@media (max-width:640px){.chev:not(.sm){grid-auto-flow:row;grid-auto-columns:auto;gap:3px}
  .chev:not(.sm) li{flex-direction:row;justify-content:space-between;gap:10px;padding:10px 14px;margin-inline:calc(var(--i) * 4%);clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,8px 100%);border-radius:6px}
  .chev:not(.sm) li:first-child{clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,8px 100%)}
  .chev:not(.sm) span{flex:1;text-align:left;font-size:.85rem}
  .chev.sm li{padding:6px 4px 5px 10px}}
.bns{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
@media (max-width:640px){.bns{grid-template-columns:1fr}}
.bnc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:12px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.bnc.s3{border-left-color:var(--bad)} .bnc.s2{border-left-color:var(--due)}
.bnc h3{font:700 1.05rem var(--display);margin:4px 0 0}
.bnc p{margin:0;font-size:.9rem}
.bnc>div{margin-top:6px}
.bnc .btn{text-decoration:none;display:inline-block}
.bnc__top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bnc__top .pill{margin-left:auto}
.sev{font:700 .66rem var(--body);text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.sev.s3{background:var(--bad);color:var(--surface)} .sev.s2{background:var(--due-bg);color:var(--due)}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
@media (max-width:640px){.lanes{grid-template-columns:1fr}}
.lane{background:var(--sunk);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}

.lane h3 i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.lane.on h3 i{background:var(--good)} .lane.part h3 i{background:var(--due)} .lane.off h3 i{background:var(--bad)}

.mc__addr{font-size:.78rem;overflow-wrap:anywhere}

</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="bar">
    <h1>IMN HQ <small id="updated">Outreach</small></h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-hq" aria-selected="true" data-view="hq">Funnel</button>
      <button role="tab" id="tab-today" aria-selected="false" data-view="today">Today</button>
      <button role="tab" id="tab-board" aria-selected="false" data-view="board">Board</button>
      <button role="tab" id="tab-prospect" aria-selected="false" data-desk data-view="prospect">Prospect</button>
      <button role="tab" id="tab-pipeline" aria-selected="false" data-desk data-view="pipeline">Pipeline</button>
      <button role="tab" id="tab-replies" aria-selected="false" data-desk data-view="replies">Replies</button>
      <button class="mob-only" id="more-btn" aria-haspopup="true" aria-expanded="false">More</button>
      <button role="tab" id="tab-affiliates" aria-selected="false" data-desk data-view="affiliates">Affiliates</button>
    </div>
  </div>
  <div class="chips" id="chips" aria-label="Filter by brand"></div>
</div></div>

<div class="more-menu" id="more-menu" hidden><button data-view="replies">Replies</button><button data-view="prospect">Prospect</button><button data-view="pipeline">Pipeline</button><button data-view="affiliates">Affiliates</button></div>
<main class="wrap">
  <section class="strip" id="strip" aria-label="This week"></section>
  <section id="view"></section>
</main>

<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet" id="sheet-body"></div></dialog>

<script>
const STAGE_LABEL = { found: 'Found', drafted: 'Drafted', sent: 'Sent', replied: 'Replied', linked: 'Linked', won: 'Won', no: 'No' };
const state = { view: 'hq', hq: null, radar: null, brand: 'all', board: null, summary: null, prospects: null, replies: null, pipeline: null, affiliates: null, needs: null, showAll: {}, open: {} };
try { const s = JSON.parse(localStorage.getItem('imn-hq2') || '{}'); if (s.view) state.view = s.view; if (s.brand) state.brand = s.brand; } catch (e) {}
const save = () => { try { localStorage.setItem('imn-hq2', JSON.stringify({ view: state.view, brand: state.brand })); } catch (e) {} };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const color = (b) => `var(--${b})`;
const siteOf = (b) => ((state.prospects?.brands.find((x) => x.key === b) || {}).site || ({ vic: 'https://victours.com.au', 'community-help-co': 'https://communityhelp.com.au', 'trade-admin': 'https://tradeadmin.com.au', trailers: 'https://www.movietrailer.channel' }[b] || '')).replace(/\/$/, '');
const brandName = (b) => (state.board?.brands.find((x) => x.key === b)?.name) || b;
const ago = (iso) => {
  if (!iso) return '';
  const d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
  if (d <= 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 14) return d + ' days ago';
  return new Date(iso).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
};
const TRI = { optout: 'Opted out', auto: 'Automatic', positive: 'Sounds like a yes', reply: 'Needs a reply' };
const tri = (t) => t && TRI[t] ? `<span class="tri ${esc(t)}">${TRI[t]}</span>` : '';
// Open an email in the mail app (phones: mailto) or Outlook on the web (computers). Call inside the click.
function compose(to, subj, bod, pre) {
  if (isPhone()) { if (pre) pre.close(); location.href = 'mailto:' + encodeURIComponent(to).replace(/%40/g, '@') + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(bod); return; }
  const url = 'https://outlook.office.com/mail/deeplink/compose?to=' + encodeURIComponent(to) + '&subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(bod);
  if (pre) { pre.opener = null; pre.location.href = url; } else { location.href = url; }
}
const short = (iso) => new Date(iso).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({ error: 'The server sent something unexpected. Refresh and try again.' }));
  if (!res.ok || data.error) throw new Error(data.error || 'Request failed (' + res.status + ')');
  return data;
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

async function load() {
  try {
    const [board, summary, prospects, replies, pipeline, affiliates, radar, needs] = await Promise.all([api('/api/board'), api('/api/summary'), api('/api/prospects'), api('/api/replies'), api('/api/pipeline'), api('/api/affiliates'), api('/api/radar'), api('/api/needs')]);
    const send = await api('/api/send/status').catch(() => null);
    const hq = await api('/api/hq').catch(() => null);
    Object.assign(state, { board, summary, prospects, replies, pipeline, affiliates, radar, needs, send, hq });
    $('#updated').textContent = 'Targets scored ' + new Date(prospects.generated).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
    render();
  } catch (e) {
    $('#view').innerHTML = '<p class="error">' + esc(e.message) + '</p>';
  }
}

function render() {
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === state.view || (b.id === 'more-btn' && ['replies', 'prospect', 'pipeline', 'affiliates'].includes(state.view)))));
  renderChips(); renderStrip();
  if (state.view === 'hq') renderHq();
  else if (state.view === 'today') renderToday();
  else if (state.view === 'board') renderBoard();
  else if (state.view === 'prospect') renderProspect();
  else if (state.view === 'pipeline') renderPipeline();
  else if (state.view === 'affiliates') renderAffiliates();
  else renderReplies();
}

function renderChips() {
  const brands = state.board.brands;
  const counts = {};
  state.board.orgs.forEach((o) => { counts[o.brand] = (counts[o.brand] || 0) + 1; });
  $('#chips').innerHTML = [`<button class="chip" aria-pressed="${state.brand === 'all'}" data-brand="all">All brands</button>`]
    .concat(brands.map((b) => `<button class="chip" style="--c:${color(b.key)}" aria-pressed="${state.brand === b.key}" data-brand="${b.key}"><i class="dot"></i>${esc(b.name)}${b.active ? '' : ' <span class="paused">paused</span>'}</button>`)).join('');
}

function inBrand(b) { return state.brand === 'all' || state.brand === b; }

function renderStrip() {
  if (state.view === 'affiliates') {
    const items = affItems();
    const c = (f) => items.filter(f).length;
    $('#strip').innerHTML = `
      <div class="stat"><b>${c((i) => i.status === 'approved')}</b><span>Approved${c((i) => i.notWired) ? ' (' + c((i) => i.notWired) + ' not live yet)' : ''}</span></div>
      <div class="stat"><b>${c((i) => i.status === 'applied')}</b><span>Applied, waiting</span></div>
      <div class="stat${c((i) => i.chase) ? ' due' : ''}"><b>${c((i) => i.chase)}</b><span>To chase (14+ days or follow-up due)</span></div>
      <div class="stat"><b>${c((i) => i.status === 'not-applied' && !i.brandList.includes('ideas'))}</b><span>Not applied yet</span></div>`;
    return;
  }
  const s = state.summary; const keys = Object.keys(s).filter(inBrand);
  const sum = (f) => keys.reduce((a, k) => a + (s[k][f] || 0), 0);
  const contacted = sum('contacted'); const answered = keys.reduce((a, k) => a + (s[k].byStage.replied || 0) + (s[k].byStage.linked || 0) + (s[k].byStage.won || 0) + (s[k].byStage.no || 0), 0);
  const rate = contacted ? Math.round((100 * answered) / contacted) + '%' : '–';
  const due = sum('followUps');
  $('#strip').innerHTML = `
    <div class="stat"><b>${sum('sentWeek')}</b><span>Sent this week</span></div>
    <div class="stat"><b>${rate}</b><span>Reply rate (${contacted} contacted)</span></div>
    <div class="stat"><b>${sum('links')}</b><span>Links won</span></div>
    <div class="stat${due ? ' due' : ''}"><b>${due}</b><span>Follow-ups due (7+ days)</span></div>`;
}

const isPhone = () => matchMedia('(max-width:640px)').matches;
function renderBoard() {
  if (isPhone() && !state.fullBoard) { renderNeeds(); return; }
  const orgs = state.board.orgs.filter((o) => inBrand(o.brand));
  if (!orgs.length) {
    $('#view').innerHTML = `<div class="hint"><strong>No organisations on the board yet.</strong> Ask Claude to "find 10 for Vic Tours" (or another brand). It picks them from <em>Where to prospect</em>, adds each one here as Found, and drafts the emails in Outlook. Cards then move to Sent and Replied on their own as the emails go out and come back.</div>`;
    return;
  }
  const cols = state.board.stages.map((st) => {
    const list = orgs.filter((o) => o.stage === st);
    const cards = list.map((o) => {
      const flag = o.followUpDue ? '<span class="pill due">Follow up</span>' : (o.stage === 'replied' ? '<span class="pill good">Replied ' + esc(ago(o.last_in || o.stage_at)) + '</span>' : '');
      return `<button class="card" style="--c:${color(o.brand)}" data-org="${o.id}">
        <span class="name">${esc(o.name)}</span>
        <span class="meta">${esc(brandName(o.brand))}${o.region ? ' · ' + esc(o.region) : ''}${o.contact_name ? ' · ' + esc(o.contact_name) : ''}</span>
        ${o.last_note ? `<span class="last">${esc(o.last_note)}</span>` : ''}
        ${o.next_step ? `<span class="meta">Next: ${esc(o.next_step)}</span>` : ''}
        <span class="meta">${esc(STAGE_LABEL[o.stage])} ${esc(ago(o.stage_at))}</span>
        ${flag}
      </button>`;
    }).join('') || '<p class="empty">Nothing here</p>';
    return `<div class="col"><h2>${STAGE_LABEL[st]} <em>${list.length}</em></h2>${cards}</div>`;
  });
  $('#view').innerHTML = (isPhone() ? '<button class="btn ghost" id="needs-back" style="margin-bottom:10px">Back to what needs you</button>' : '') + `<div class="board" role="list">${cols.join('')}</div>`;
  if ($('#needs-back')) $('#needs-back').onclick = () => { state.fullBoard = false; renderBoard(); };
}

function renderProspect() {
  const brands = state.prospects.brands.filter((b) => inBrand(b.key)).sort((a, z) => (z.active - a.active));
  $('#view').innerHTML = `<div class="pgrid">${brands.map((b) => {
    const all = !!state.showAll[b.key];
    const rows = all ? b.top : b.next.slice(0, b.active ? Math.max(b.leftThisWeek, 5) : 5);
    const pct = Math.round((100 * b.foundThisWeek) / b.weeklyCap);
    return `<article class="pbrand" style="--c:${color(b.key)}">
      <div class="phead">
        <h2>${esc(b.name)}</h2>
        <span class="sub">${b.active ? 'Active' : 'Paused (pilot is Vic Tours and Community Help Co)'} · ${b.covered} of ${b.targets} targets covered, ${b.started} started</span>
        <span class="cap">${b.foundThisWeek}/${b.weeklyCap} found this week<span class="meter"><i style="width:${Math.min(100, pct)}%"></i></span></span>
      </div>
      <ol class="plist">${rows.map((t) => `
        <li class="prow">
          <div class="score">${t.score.toFixed(0)}<small>score</small></div>
          <div class="ptitle">${esc(t.regionLabel)} <span>· ${esc(t.segmentLabel)}</span></div>
          <span class="pill${t.status === 'covered' ? ' good' : ''}">${t.status === 'open' ? 'Open' : t.status === 'started' ? t.found + ' found' : 'Covered'}</span>
          <div class="pwhy">${esc(t.why)}${t.learn !== 1 ? ' · segment ' + (t.learn > 1 ? 'converting' : 'not converting') + ' (×' + t.learn + ')' : ''}</div>
          <div class="poffer"><strong>Offer:</strong> ${esc(t.offer)}</div>
          <div class="pq">${t.search.map((q) => `<a href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">${esc(q)}</a>`).join('')}${t.page ? `<a href="${esc(t.page)}" target="_blank" rel="noopener">Our page ↗</a>` : ''}</div>
          ${t.status === 'covered' ? '' : `<button class="draft-btn" data-draft="${esc(t.brand)}|${esc(t.key)}">Draft email</button>`}
        </li>`).join('')}</ol>
      <button class="more" data-more="${b.key}">${all ? 'Show next up only' : 'Show top 40 targets'}</button>
    </article>`;
  }).join('')}</div>`;
}

function renderReplies() {
  const list = state.replies.messages.filter((m) => inBrand(m.brand));
  if (!list.length) { $('#view').innerHTML = '<div class="hint">No replies yet. Every email that reaches a brand address (hello@, simon@, partners@) shows up here, with the organisation it matched.</div>'; return; }
  $('#view').innerHTML = `<ul class="rlist">${list.map((m) => `
    <li><i class="dot" style="--c:${color(m.brand)}"></i>
      <span class="who">${m.org_name ? `<button class="linkish" data-org="${m.org_id}" style="border:0;background:none;padding:0;font-weight:600;color:var(--accent)">${esc(m.org_name)}</button>` : esc(m.mail_from)}</span>
      <time datetime="${esc(m.at)}">${esc(short(m.at))}</time>
      <span class="subj">${tri(m.triage)} ${esc(m.subject || '(no subject)')} · ${m.org_name ? esc(m.mail_from) + ' → ' : 'to '}${esc(m.mail_to)}</span>
      ${m.body ? `<div class="rbody${state.open[m.id] ? '' : ' clamp'}">${esc(m.body)}</div>${m.body.length > 180 ? `<button class="rmore" data-expand="${m.id}">${state.open[m.id] ? 'Show less' : 'Show full email'}</button>` : ''}` : ''}
    </li>`).join('')}</ul>`;
}

async function openOrg(id) {
  const dlg = $('#sheet'); const body = $('#sheet-body');
  body.innerHTML = '<p>Loading…</p>'; if (!dlg.open) dlg.showModal();
  try {
    const d = await api('/api/orgs/' + id);
    const o = d.org; const c = d.contacts[0];
    const items = d.touches.map((t) => ({ at: t.at, text: `<strong>${esc(STAGE_LABEL[t.stage] || t.stage)}</strong>${t.subject ? ' · ' + esc(t.subject) : ''}${t.note ? ' · ' + esc(t.note) : ''}` }))
      .concat(d.messages.map((m) => ({ at: m.at, text: (m.direction === 'in' ? 'Email in from ' + esc(m.mail_from) + ' ' + tri(m.triage) : 'Email out to ' + esc(m.mail_to)) + ' · ' + esc(m.subject || '') + (m.body ? `<div class="rbody" style="margin-top:6px">${esc(m.body)}</div>` : '') })))
      .sort((a, z) => z.at.localeCompare(a.at));
    body.innerHTML = `
      <header><div><h2 id="sheet-title">${esc(o.name)}</h2><span class="pill" style="margin-top:6px">${esc(brandName(o.brand))}</span></div><button class="close" id="close">Close</button></header>
      <dl class="kv">
        ${c ? `<dt>Contact</dt><dd>${esc(c.name || '')}${c.role ? ', ' + esc(c.role) : ''} <span>${esc(c.email)}</span>${c.opted_out_at ? ' <span class="pill due">Opted out</span>' : ''}</dd>` : ''}
        ${o.website ? `<dt>Website</dt><dd><a href="${esc(o.website)}" target="_blank" rel="noopener">${esc(o.website)}</a></dd>` : ''}
        ${o.evidence_url ? `<dt>Links page</dt><dd><a href="${esc(o.evidence_url)}" target="_blank" rel="noopener">${esc(o.evidence_url)}</a></dd>` : ''}
        ${d.target ? `<dt>Target</dt><dd>${esc(d.target.segmentLabel)} · ${esc(d.target.regionLabel)}</dd>` : ''}
        ${o.notes ? `<dt>Notes</dt><dd>${esc(o.notes)}</dd>` : ''}
        <dt>On our page</dt><dd>${d.featured.length ? d.featured.map((f) => `<a href="${esc(siteOf(o.brand) + f.path)}" target="_blank" rel="noopener">${esc(f.path)}</a>`).join(', ') + ' <button class="btn ghost" id="unfeature" style="padding:2px 10px">Remove</button>' : (o.brand === 'paycalc' ? 'Not available for MyPayCalc yet' : `Not featured <button class="btn ghost" id="feature" style="padding:2px 10px">Feature on ${esc(d.page ? new URL(d.page).pathname : 'our page')}</button>`)}</dd>
        ${d.links.length ? `<dt>Links won</dt><dd>${d.links.map((l) => `<a href="${esc(l.page_url)}" target="_blank" rel="noopener">${esc(l.page_url)}</a>`).join('<br>')}</dd>` : ''}
      </dl>
      <div><label>Stage</label><div class="stages" style="margin-top:6px">${state.board.stages.map((s) => `<button data-stage="${s}" aria-pressed="${o.stage === s}">${STAGE_LABEL[s]}</button>`).join('')}</div></div>
      <div><label for="next">Next step</label><div class="row" style="margin-top:6px"><input type="text" id="next" value="${esc(o.next_step || '')}" placeholder="e.g. Follow up on 12 Nov"><button class="btn" id="save-next">Save</button></div></div>
      <div><label for="note">Add a note</label><textarea id="note" placeholder="What happened?"></textarea><div class="row" style="margin-top:6px"><button class="btn" id="save-note">Add note</button></div></div>
      <div><label>History</label><ul class="timeline" style="margin-top:8px">${items.map((i) => `<li><time>${esc(short(i.at))}</time><span class="t-body">${i.text}</span></li>`).join('') || '<li><span></span><span class="t-body">No history yet</span></li>'}</ul></div>`;
    $('#close').onclick = () => dlg.close();
    if ($('#feature')) $('#feature').onclick = async () => { try { const r = await api('/api/orgs/' + id + '/feature', {}); toast('Featured on ' + r.path); await load(); openOrg(id); } catch (e) { toast(e.message); } };
    if ($('#unfeature')) $('#unfeature').onclick = async () => { try { await api('/api/orgs/' + id + '/unfeature', {}); toast('Removed from our page'); await load(); openOrg(id); } catch (e) { toast(e.message); } };
    body.querySelectorAll('[data-stage]').forEach((b) => b.onclick = async () => {
      const note = b.dataset.stage === 'no' ? ($('#note').value.trim() || 'No') : $('#note').value.trim() || null;
      try { await api('/api/orgs/' + id + '/stage', { stage: b.dataset.stage, note }); toast('Moved to ' + STAGE_LABEL[b.dataset.stage]); await load(); openOrg(id); } catch (e) { toast(e.message); }
    });
    $('#save-next').onclick = async () => { try { await api('/api/orgs/' + id + '/next', { next_step: $('#next').value }); toast('Next step saved'); load(); } catch (e) { toast(e.message); } };
    $('#save-note').onclick = async () => { try { await api('/api/orgs/' + id + '/note', { note: $('#note').value }); toast('Note added'); await load(); openOrg(id); } catch (e) { toast(e.message); } };
  } catch (e) {
    body.innerHTML = '<p class="error">' + esc(e.message) + '</p><button class="close" onclick="this.closest(\'dialog\').close()">Close</button>';
  }
}

// ---------- Draft email from a prospect target ----------
const fill = (text, v) => text
  .replaceAll('{first_name}', v.first || 'there')
  .replaceAll('{organisation}', v.org || 'your organisation')
  .replaceAll('{region}', v.region || '')
  .replaceAll('{page}', v.page || v.site || '')
  .replaceAll('{site}', (v.site || '').replace(/^https?:\/\//, ''))
  .replaceAll('{widget}', v.widget || v.page || v.site || '');

async function openDraft(brand, key, org) {
  const pb = state.prospects.brands.find((b) => b.key === brand);
  let t = pb ? pb.top.concat(pb.next).find((x) => x.key === key) : null;
  if (!t && org) {
    const [seg, region] = String(key || '').split(':');
    t = { key, segment: seg, segmentLabel: org.type || seg, regionLabel: org.region || region || '', page: (pb && pb.pages && pb.pages[key]) || null, why: '', offer: '', evidence: '', search: [], score: org.score || 0 };
  }
  if (!t) return;
  const dlg = $('#sheet'); const body = $('#sheet-body');
  body.innerHTML = '<p>Loading…</p>'; if (!dlg.open) dlg.showModal();
  let tpl;
  try { tpl = await api('/api/templates?brand=' + encodeURIComponent(brand) + '&segment=' + encodeURIComponent(t.segment)); } catch (e) { body.innerHTML = '<p class="error">' + esc(e.message) + '</p>'; return; }
  const d = { ver: 0, subject: tpl.versions[0].subject, body: tpl.versions[0].body, id: tpl.versions[0].id, edited: false };
  const written = org && org.draft_body ? { subject: org.draft_subject || tpl.versions[0].subject, body: org.draft_body } : null;
  const from = tpl.brand.from || '';
  const vals = () => ({ first: ($('#d-contact').value.trim().split(/\s+/)[0] || ''), org: $('#d-org').value.trim(), region: t.regionLabel, page: t.page || tpl.brand.site, site: tpl.brand.site, widget: (org && org.widget_url) || '' });
  body.innerHTML = `
    <header><div><h2 id="sheet-title">Draft email</h2><span class="pill" style="margin-top:6px">${esc(tpl.brand.name)} · ${esc(t.segmentLabel)} · ${esc(t.regionLabel)}</span></div><button class="close" id="close">Close</button></header>
    <p class="empty" id="d-pre" hidden style="padding:0"><b>Radar wrote this email for them.</b> Read it, edit anything, then send.</p>
    <div class="why">
      ${org && org.why_now ? `<span><b>Why now${org.trigger_date && org.trigger_date !== 'evergreen' ? ' (' + esc(whenLabel(org.trigger_date)) + ')' : ''}:</b> ${esc(org.why_now)}</span>` : ''}
      ${org && org.why ? `<span><b>Why ${esc(org.name)} (Radar ${esc(org.score ?? '')}):</b> ${esc(org.why)}</span>` : ''}
      ${org && org.gap ? `<span><b>Their gap:</b> ${esc(org.gap)}</span>` : ''}
      ${org && org.widget_url ? `<span><b>Their widget preview:</b> <a href="${esc(org.widget_url)}" target="_blank" rel="noopener">open ↗</a> (fills {widget} in the email)</span>` : ''}
      ${org && org.opener ? `<span><b>Suggested first line:</b> ${esc(org.opener)} <button class="btn ghost" id="d-opener" style="padding:2px 8px;margin-left:4px">Use it</button></span>` : ''}
      <span><b>Why this target (score ${Number(t.score || 0).toFixed(0)}):</b> ${esc(t.why)}</span>
      <span><b>Offer:</b> ${esc(t.offer)}</span>
      <span><b>Look for:</b> ${esc(t.evidence)} Use an address they publish themselves.</span>
      <span class="pq" style="margin-top:4px">${t.search.map((q) => `<a href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">${esc(q)}</a>`).join('')}</span>
    </div>
    <div class="grid2">
      <div class="field"><label for="d-org">Organisation</label><input id="d-org" type="text" placeholder="e.g. Daylesford Visitor Centre"></div>
      <div class="field"><label for="d-email">Email they publish</label><input id="d-email" type="text" inputmode="email" placeholder="info@…"></div>
      <div class="field"><label for="d-contact">Contact name (optional)</label><input id="d-contact" type="text" placeholder="First name used in the greeting"></div>
      <div class="field"><label for="d-role">Their role (optional)</label><input id="d-role" type="text"></div>
      <div class="field"><label for="d-web">Website</label><input id="d-web" type="text" placeholder="https://…"></div>
      <div class="field"><label for="d-evidence">Page where they link to guides</label><input id="d-evidence" type="text" placeholder="https://… (checked daily for your link)"></div>
    </div>
    <div class="mail">
      <label>Template</label>
      <div class="vers desk-only" id="d-vers">${tpl.versions.map((v, i) => `<button data-ver="${i}" aria-pressed="${i === 0}">v${v.version}${v.perf.sent ? ` · ${v.perf.replied}/${v.perf.sent} replied` : ''}</button>`).join('')}</div>
      <div class="field"><label for="d-subject">Subject</label><input id="d-subject" type="text"></div>
      <div class="field"><label for="d-body">Email (placeholders: {first_name} {organisation} {region} {page} {site})</label><textarea id="d-body"></textarea></div>
      <div class="row desk-only"><input id="d-note" type="text" placeholder="What did you change? (for the saved version)" style="flex:1;min-width:180px"><button class="btn ghost" id="d-save">Save as new version</button></div>
      <label>Preview</label>
      <div class="preview" id="d-preview"></div>
    </div>
    ${brand !== 'paycalc' && t.page ? `<label class="fcheck"><input type="checkbox" id="d-feature" checked><span><b>Give first:</b> add them to <a href="${esc(t.page)}" target="_blank" rel="noopener">${esc(new URL(t.page).pathname)}</a> as a useful contact before you send, and say so in the email. Uses the Website field above.</span></label>` : ''}
    ${from ? `<div class="from">In Outlook, set From to <span id="d-from">${esc(from)}</span><button class="btn ghost" id="d-copyfrom" style="padding:3px 10px">Copy</button></div>` : ''}
    ${sendLine(brand)}
    <div class="row go-bar">
      ${canSend(brand) ? `<button class="btn" id="d-send">Send now from ${esc(from)}</button>` : ''}
      <button class="btn${canSend(brand) ? ' ghost' : ''}" id="d-go">Add to board &amp; open in Outlook</button>
      <button class="btn ghost" id="d-copy">Copy email</button>
    </div>
    <div class="row copy-bar">
      <span class="meta">Outlook didn't open the draft? Copy and paste:</span>
      <button class="btn ghost" id="d-copyto">1. Copy To</button>
      <button class="btn ghost" id="d-copysubj">2. Copy subject</button>
      <button class="btn ghost" id="d-copy2">3. Copy email</button>
    </div>
    <p class="empty phone-only" style="padding:0 0 4px"><b>On your phone:</b> the email opens in your mail app. Check <b>From</b> is the brand address, not your work account.</p>
    <p class="empty" style="padding:0">The brand signature is added automatically when you send. The card moves to Sent by itself once it's gone.</p>`;
  if (org) {
    $('#d-org').value = org.name || ''; $('#d-email').value = org.contact_email || ''; $('#d-contact').value = org.contact_name || '';
    $('#d-role').value = org.contact_role || ''; $('#d-web').value = org.website || ''; $('#d-evidence').value = org.evidence_url || '';
    $('#d-go').textContent = 'Open in Outlook';
  }
  if (written) $('#d-pre').hidden = false;
  const setVer = (i) => { const v = tpl.versions[i]; Object.assign(d, { ver: i, subject: v.subject, body: v.body, id: v.id }); $('#d-subject').value = v.subject; $('#d-body').value = v.body; body.querySelectorAll('[data-ver]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.ver) === i))); preview(); };
  const giveFirst = () => !!($('#d-feature') && $('#d-feature').checked);
  // The email text as sent: with "Give first" ticked, the sentence saying we've already featured them goes in.
  const mailBody = () => {
    let b = $('#d-body').value;
    if (!giveFirst()) return b;
    const line = (state.needs && state.needs.featureLine) || "I've already added {organisation} to that page as a useful contact, so people using it can find you too.";
    const offer = /I'm also happy to add \{organisation\} to the page so visitors can find you\./;
    if (offer.test(b)) return b.replace(offer, line);
    const i = b.lastIndexOf('\n\nThanks,');
    return i > -1 ? b.slice(0, i) + '\n\n' + line + b.slice(i) : b + '\n\n' + line;
  };
  const preview = () => { $('#d-preview').textContent = 'Subject: ' + fill($('#d-subject').value, vals()) + '\n\n' + fill(mailBody(), vals()); };
  if ($('#d-feature')) $('#d-feature').onchange = preview;
  setVer(0);
  if (written) { $('#d-subject').value = written.subject; $('#d-body').value = written.body; preview(); }
  if (org && org.opener && $('#d-opener')) $('#d-opener').onclick = () => {
    const b = $('#d-body').value; const i = b.indexOf('\n\n');
    $('#d-body').value = i > -1 ? b.slice(0, i + 2) + org.opener + '\n\n' + b.slice(i + 2) : org.opener + '\n\n' + b;
    d.edited = true; preview();
  };
  ['#d-org', '#d-contact', '#d-subject', '#d-body'].forEach((s) => $(s).addEventListener('input', () => { if (s === '#d-subject' || s === '#d-body') d.edited = true; preview(); }));
  body.querySelectorAll('[data-ver]').forEach((b) => b.onclick = () => setVer(Number(b.dataset.ver)));
  $('#close').onclick = () => dlg.close();
  const copy = async (text, ok) => { try { await navigator.clipboard.writeText(text); toast(ok); } catch (e) { toast('Copy failed: select the text and copy it'); } };
  if (from) $('#d-copyfrom').onclick = () => copy(from, 'From address copied');
  $('#d-copy').onclick = () => copy(fill(mailBody(), vals()), 'Email copied');
  $('#d-copy2').onclick = () => copy(fill(mailBody(), vals()), 'Email copied');
  $('#d-copyto').onclick = () => copy($('#d-email').value.trim(), 'To address copied');
  $('#d-copysubj').onclick = () => copy(fill($('#d-subject').value, vals()), 'Subject copied');
  $('#d-save').onclick = async () => {
    try {
      const r = await api('/api/templates', { brand, segment: t.segment, subject: $('#d-subject').value, body: $('#d-body').value, note: $('#d-note').value });
      toast('Saved as v' + r.version);
      const fresh = await api('/api/templates?brand=' + encodeURIComponent(brand) + '&segment=' + encodeURIComponent(t.segment));
      tpl.versions = fresh.versions;
      $('#d-vers').innerHTML = tpl.versions.map((v, i) => `<button data-ver="${i}" aria-pressed="${i === 0}">v${v.version}${v.perf.sent ? ` · ${v.perf.replied}/${v.perf.sent} replied` : ''}</button>`).join('');
      body.querySelectorAll('[data-ver]').forEach((b) => b.onclick = () => setVer(Number(b.dataset.ver)));
      Object.assign(d, { ver: 0, id: tpl.versions[0].id, edited: false });
    } catch (e) { toast(e.message); }
  };
  $('#d-go').onclick = async () => {
    const v = vals();
    if (giveFirst() && !$('#d-web').value.trim()) { toast('Add their website for Give first (or untick it)'); $('#d-web').focus(); return; }
    // Open the tab inside the click (pop-up blockers allow that), then point it at Outlook once the board is updated.
    const w = isPhone() ? null : window.open('about:blank', '_blank');
    try {
      let orgId = org ? org.id : null;
      if (org && org.stage === 'drafted') { /* retry: already on the board as Drafted */ }
      else if (org) await api('/api/orgs/' + org.id + '/drafted', { template_id: d.id, subject: fill($('#d-subject').value, v), email: $('#d-email').value, contact_name: $('#d-contact').value });
      else orgId = (await api('/api/prospects/start', { brand, target: t.key, organisation: v.org, email: $('#d-email').value, contact_name: $('#d-contact').value, contact_role: $('#d-role').value, website: $('#d-web').value, evidence_url: $('#d-evidence').value, template_id: d.id, subject: fill($('#d-subject').value, v) })).orgId;
      // Give first: put them on our page before the email that says so goes out.
      if (giveFirst() && orgId) {
        try { await api('/api/orgs/' + orgId + '/feature', { url: $('#d-web').value, name: v.org || undefined }); }
        catch (e) { if (w) w.close(); toast('Not featured: ' + e.message + ' The card is on the board; fix it there, then open the draft again.'); load(); return; }
      }
      const to = $('#d-email').value.trim(), subj = fill($('#d-subject').value, v), bod = fill(mailBody(), v);
      // Phones: mailto (the mail app opens a new email with everything filled in; check From there).
      // Computers: Outlook on the web, where the From picker works.
      compose(to, subj, bod, w);
      if (org && org.stage === 'drafted') toast('Opened in Outlook again');
      else toast(d.edited ? 'Added as Drafted. Your unsaved edits count under the version you started from.' : 'Added to the board as Drafted');
      if (!(org && org.stage === 'drafted' && isPhone())) dlg.close();
      load();
    } catch (e) { if (w) w.close(); toast(e.message); }
  };
  if ($('#d-send')) $('#d-send').onclick = async () => {
    const v = vals(); const btn = $('#d-send');
    if (giveFirst() && !$('#d-web').value.trim()) { toast('Add their website for Give first (or untick it)'); $('#d-web').focus(); return; }
    const to = $('#d-email').value.trim(), subj = fill($('#d-subject').value, v), bod = fill(mailBody(), v);
    if (!confirm('Send to ' + to + ' from ' + from + '?')) return;
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      let orgId = org ? org.id : null;
      if (org) { if (org.stage !== 'drafted') await api('/api/orgs/' + org.id + '/drafted', { template_id: d.id, subject: subj, email: to, contact_name: $('#d-contact').value }); }
      else orgId = (await api('/api/prospects/start', { brand, target: t.key, organisation: v.org, email: to, contact_name: $('#d-contact').value, contact_role: $('#d-role').value, website: $('#d-web').value, evidence_url: $('#d-evidence').value, template_id: d.id, subject: subj })).orgId;
      if (giveFirst() && orgId) {
        try { await api('/api/orgs/' + orgId + '/feature', { url: $('#d-web').value, name: v.org || undefined }); }
        catch (e) { toast('Not sent: featuring failed (' + e.message + '). Fix it on the card, then send.'); load(); btn.disabled = false; return; }
      }
      const r = await api('/api/orgs/' + orgId + '/send', { kind: 'first', to, subject: subj, body: bod, contact_name: $('#d-contact').value });
      state.send = r.status; toast('Sent ✓'); dlg.close(); load();
    } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'Send now from ' + from; load(); }
  };
}

// One-click send: on when the Microsoft app is set up, the brand is on the mail hub, and today's ramp has room.
function canSend(brand) { const s = state.send; return !!(s && s.configured && (s.left[brand] || 0) > 0); }
function sendLine(brand) {
  const s = state.send; if (!s || !s.configured) return '';
  const left = s.left[brand] || 0;
  return `<p class="empty" style="padding:0"><b>Sending today:</b> ${s.sentToday} sent · ${left} left for ${esc(brandName(brand))} · ${esc(s.ramp)}${left ? '' : '. Today\'s limit is reached; send tomorrow or open in Outlook.'}</p>`;
}

function renderNeeds() {
  const orgs = state.board.orgs.filter((o) => inBrand(o.brand));
  const card = (o, flag, after = '') => `<div class="card-wrap"><button class="card" style="--c:${color(o.brand)}" data-org="${o.id}"><span class="name">${esc(o.name)}</span><span class="meta">${esc(brandName(o.brand))}${o.contact_email ? ' · ' + esc(o.contact_email) : ''}</span>${o.last_note ? `<span class="last">${esc(o.last_note)}</span>` : ''}${flag}</button>${after}</div>`;
  const sec = (title, list, flag, hint, after = () => '') => `<section class="needs"><h2>${title} <em>${list.length}</em></h2>${list.length ? list.map((o) => card(o, flag(o), after(o))).join('') : `<p class="empty" style="padding:0 0 6px">${hint}</p>`}</section>`;
  const replied = orgs.filter((o) => o.stage === 'replied');
  const due = orgs.filter((o) => o.followUpDue);
  const drafted = orgs.filter((o) => o.stage === 'drafted');
  const sent = orgs.filter((o) => o.stage === 'sent' && !o.followUpDue);
  $('#view').innerHTML = `
    ${sec('Replied: answer them', replied, (o) => `<span class="pill good">Replied ${esc(ago(o.last_in || o.stage_at))}</span>`, 'No replies waiting.')}
    ${sec('Follow up (7+ days)', due, () => '<span class="pill due">Follow up</span>', 'Nothing to chase.')}
    ${sec('Drafted: send them', drafted, (o) => `<span class="meta">Drafted ${esc(ago(o.stage_at))}</span>`, 'No drafts waiting.', (o) => `<button class="btn ghost retry" data-retry="${o.id}">↻ Open in Outlook again</button>`)}
    ${drafted.length ? '<p class="empty" style="padding:0 0 8px">Didn\'t reach Outlook (e.g. not signed in)? Sign in at outlook.office.com first, then tap ↻.</p>' : ''}
    ${sec('Waiting for a reply', sent, (o) => `<span class="meta">Sent ${esc(ago(o.stage_at))}</span>`, 'Nothing out yet.')}
    <button class="btn ghost" id="full-board" style="width:100%;padding:12px">Show the full board (${orgs.length})</button>`;
  $('#full-board').onclick = () => { state.fullBoard = true; renderBoard(); };
}

// ---------- Follow-through: replies that need you, and one follow-up ----------
function renderFollowThrough() {
  const msgs = ((state.needs && state.needs.messages) || []).filter((m) => inBrand(m.brand));
  const due = state.board.orgs.filter((o) => o.followUpDue && inBrand(o.brand));
  if (!msgs.length && !due.length) return '';
  const reply = msgs.map((m) => `
    <article class="rcard" style="--c:${color(m.brand)}">
      <div><h3 style="margin:0">${m.org_id ? `<button class="linkish" data-org="${m.org_id}" style="border:0;background:none;padding:0;font:inherit;font-weight:700;color:inherit;text-align:left">${esc(m.org_name || m.mail_from)}</button>` : esc(m.mail_from)}${tri(m.triage)}</h3>
        <div class="meta">${esc(brandName(m.brand))} · ${esc(m.mail_from)} · ${esc(ago(m.at))}</div></div>
      ${m.body ? `<div class="rbody${state.open['n' + m.id] ? '' : ' clamp'}">${esc(m.body)}</div>${m.body.length > 180 ? `<button class="rmore" data-nexpand="${m.id}">${state.open['n' + m.id] ? 'Show less' : 'Show full email'}</button>` : ''}` : `<p class="meta" style="margin:0">${esc(m.subject || '')}</p>`}
      ${m.triage === 'positive' ? '<p class="meta" style="margin:0">Sounds like a yes: their page gets checked for your link first thing tomorrow. Say thanks!</p>' : ''}
      <div class="ractions">
        <button class="btn" data-nreply="${m.id}">Reply</button>
        <button class="btn ghost" data-ndone="${m.id}">Done</button>
        ${m.org_id ? `<button class="btn ghost" data-noptout="${m.id}">They said no thanks</button>` : ''}
      </div>
    </article>`).join('');
  const fu = due.map((o) => `
    <article class="rcard" style="--c:${color(o.brand)}">
      <div><h3 style="margin:0"><button class="linkish" data-org="${o.id}" style="border:0;background:none;padding:0;font:inherit;font-weight:700;color:inherit;text-align:left">${esc(o.name)}</button></h3>
        <div class="meta">${esc(brandName(o.brand))}${o.contact_email ? ' · ' + esc(o.contact_email) : ''} · sent ${esc(ago(o.stage_at))}, no reply</div></div>
      <div class="ractions">
        <button class="btn" data-fu="${o.id}">Write follow-up</button>
        <button class="btn ghost" data-fuclose="${o.id}">Close, no follow-up</button>
      </div>
    </article>`).join('');

function whenLabel(d) {
  const t = Date.parse(d + 'T00:00:00'); if (!t) return d;
  const days = Math.round((t - Date.now()) / 86400000);

function spark(series) {
  if (!series || series.length < 2) return '';
  const max = Math.max(1, ...series.map((p) => p.impressions));
  const pts = series.map((p, i) => `${(i / (series.length - 1)) * 116 + 2},${26 - (p.impressions / max) * 22}`).join(' ');
  return `<svg class="spark" viewBox="0 0 120 28" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
}
function delta(now, then) {
  if (then === null || then === undefined) return '';
  const d = now - then;
  return `<span class="delta ${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '+' : ''}${d}</span>`;
}

  $('#view').innerHTML = `<div class="cards2">${funHtml}</div>
    <section class="sec"><h2>Links won and page performance</h2>${linkHtml}</section>
    <section class="sec"><h2>Template performance</h2>${tplHtml}</section>`;
}


// ---------- Funnel tab: one funnel from first contact to money, bottlenecks, email connections, brand pipeline ----------
const pctTxt = (a, b) => { if (!a) return '–'; const r = (100 * b) / a; return r >= 10 ? Math.round(r) + '%' : r >= 1 ? r.toFixed(1) + '%' : r > 0 ? r.toFixed(2) + '%' : '0%'; };
const nf = (v) => Number(v || 0).toLocaleString('en-AU');
function leakAt(steps) {
  let at = -1, worst = Infinity;
  for (let i = 1; i < steps.length; i++) { if (steps[i - 1].v < 3) continue; const r = steps[i].v / steps[i - 1].v; if (r < worst) { worst = r; at = i; } }
  return at;
}
function chevrons(steps, opts = {}) {
  const leak = opts.leak === false ? -1 : leakAt(steps);
  return `<ol class="chev${opts.small ? ' sm' : ''}">${steps.map((st, i) => `
    <li class="${st.v ? 'has' : ''}${i === leak ? ' leak' : ''}" style="--i:${i}">
      <b>${st.v === null ? '–' : nf(st.v)}</b><span>${esc(st.l)}</span>
      ${i > 0 && !opts.small ? `<em>${i === leak ? '▼ ' : ''}${pctTxt(steps[i - 1].v, st.v)}</em>` : ''}
    </li>`).join('')}</ol>`;
}
function hqData() {
  const keys = Object.keys(state.summary).filter(inBrand);
  const fun = state.pipeline.funnel.filter((f) => inBrand(f.key));
  const step = (st) => fun.reduce((a, f) => a + (f.steps.find((x) => x.stage === st)?.count || 0), 0);
  const sites = state.hq ? Object.entries(state.hq.sites).filter(([k]) => inBrand(k)) : [];
  const ssum = (f) => sites.reduce((a, [, s]) => a + (f(s) || 0), 0);
  const orgs = state.board.orgs.filter((o) => inBrand(o.brand));
  return {
    keys, fun, sites, orgs,
    outreach: [{ l: 'Found', v: step('found') }, { l: 'Drafted', v: step('drafted') }, { l: 'Sent', v: step('sent') }, { l: 'Replied', v: step('replied') }, { l: 'Linked', v: step('linked') }],
    site: [{ l: 'Seen on Google', v: ssum((s) => s.seen) }, { l: 'Visits', v: ssum((s) => s.visits) }, { l: 'Button clicks', v: ssum((s) => s.clicks) }, { l: 'Money clicks', v: ssum((s) => s.money) }],
    sentWeek: keys.reduce((a, k) => a + (state.summary[k].sentWeek || 0), 0),
  };
}
function bottlenecks(d) {
  const out = [];
  const go = (view, label, brand) => `<button class="btn" data-hqgo="${view}|${brand || ''}">${label} →</button>`;
  const byBrand = {};
  d.orgs.filter((o) => o.stage === 'drafted').forEach((o) => { (byBrand[o.brand] = byBrand[o.brand] || []).push(o); });
  for (const [b, list] of Object.entries(byBrand)) {
    const oldest = Math.max(...list.map((o) => o.days || 0));
    out.push({ sev: 3, rank: 0, brand: b, stage: 'Sent', title: `${list.length} ${brandName(b)} email${list.length > 1 ? 's' : ''} drafted, not sent`, detail: `Waiting up to ${oldest} day${oldest === 1 ? '' : 's'}. A draft earns nothing until it goes out.`, fix: 'Send the best 5 now. Drop the ones you wouldn’t send.', who: 'Simon', act: go('board', 'Open drafts', b) });
  }
  const needs = (state.needs?.messages || []).filter((m) => inBrand(m.brand));
  if (needs.length) out.push({ sev: 3, rank: 1, brand: null, stage: 'Replied', title: `${needs.length} repl${needs.length > 1 ? 'ies' : 'y'} waiting for you`, detail: 'Someone answered. Fast replies win links.', fix: 'Reply today, even a one-liner.', who: 'Simon', act: go('today', 'Open replies') });
  const due = d.orgs.filter((o) => o.followUpDue);
  if (due.length) out.push({ sev: 2, brand: null, stage: 'Replied', title: `${due.length} follow-up${due.length > 1 ? 's' : ''} due`, detail: 'Sent 7+ days ago with no answer. One short nudge often doubles replies.', fix: 'Send the one-line follow-up from Today.', who: 'Simon', act: go('today', 'Open follow-ups') });
  const rq = (state.radar?.queue || []).filter((o) => inBrand(o.brand));
  if (rq.length) out.push({ sev: 2, brand: null, stage: 'Drafted', title: `${rq.length} Radar prospect${rq.length > 1 ? 's' : ''} to review`, detail: 'Found and researched, waiting for your yes or no.', fix: 'Draft the good ones, drop the rest (it teaches Radar).', who: 'Simon', act: go('today', 'Review prospects') });
  for (const m of (state.hq?.mail || []).filter((x) => inBrand(x.brand))) {
    if (m.inOutreach && !m.mailReady) out.push({ sev: m.brand === 'trade-admin' ? 3 : 1, brand: m.brand, stage: 'Found', title: `${m.name} email not connected`, detail: m.brand === 'trade-admin' ? 'Radar can’t queue Trade Admin prospects, so the 30-day push has no outreach.' : 'No outreach yet. Fine while it’s on autopilot.', fix: 'Do the 15-minute mail hub setup with Claude in the Site Factory chat.', who: 'Simon', act: '<a class="btn" href="https://admin.microsoft.com" target="_blank" rel="noopener">M365 admin ↗</a>' });
    else if (m.mailReady && !m.steps.track) out.push({ sev: 1, brand: m.brand, stage: 'Replied', title: `${m.name} replies aren’t tracked`, detail: 'Not on the mail hub, so replies don’t appear here on their own.', fix: 'Mark replies on the card by hand for now.', who: 'Simon' });
  }
  const live = (state.hq?.mail || []).filter((m) => m.mailReady && inBrand(m.brand)).length;
  const goal = live * 25;
  if (live && d.sentWeek < goal / 2) out.push({ sev: 3, rank: 2, brand: null, stage: 'Sent', title: `${d.sentWeek} sent this week, goal ${goal}`, detail: `5 a day for each of ${live} connected brand${live > 1 ? 's' : ''}. Outreach is the fastest lever while Google warms up.`, fix: 'Block 15 minutes each morning: Today → send what’s queued.', who: 'Simon', act: go('today', 'Start today’s sends') });
  if (state.send && !state.send.configured) out.push({ sev: 1, brand: null, stage: 'Sent', title: 'One-click send is off', detail: 'Each email opens in Outlook instead of sending from here.', fix: 'Add the 3 Microsoft secrets to imn-hq when you have 10 minutes (Claude can walk you through it).', who: 'Simon' });
  for (const [k, s] of d.sites) {
    if (!s.ga4) continue;
    if (s.seen >= 150 && s.googleClicks / s.seen < 0.005) out.push({ sev: 2, brand: k, stage: 'Visits', title: `${brandName(k)}: Google shows it, nobody clicks`, detail: `${nf(s.seen)} search views, ${s.googleClicks} clicks${s.position ? ', average position ' + s.position : ''}. Page 1 starts at 10.`, fix: 'Opportunity engine sharpens the most-seen pages.', who: 'Claude' });
    if (s.tracksMoney && s.visits >= 20 && s.money === 0) out.push({ sev: 2, brand: k, stage: 'Money', title: `${brandName(k)}: ${s.visits} visits, 0 money clicks`, detail: 'Visitors arrive but nobody reaches a partner link.', fix: 'Move the partner offer higher on the most-visited pages.', who: 'Claude' });
  }
  return out.sort((a, b) => b.sev - a.sev || (a.rank ?? 9) - (b.rank ?? 9));
}
function renderHq() {
  const d = hqData();
  const bn = bottlenecks(d);
  const SEV = { 3: 'Critical', 2: 'Leak', 1: 'Watch' };
  const asOf = state.hq && Object.values(state.hq.sites)[0]?.asOf;
  const funnel = `<section class="hqf">
    <div class="today-head"><h2>Growth funnel</h2><span class="meta">Outreach is live · site numbers last 28 days${asOf ? ', updated ' + esc(ago(asOf)) : ''}</span></div>
    <p class="hqf__label">Outreach → partners</p>${chevrons(d.outreach)}
    <p class="hqf__label">Search → visits → money</p>${state.hq ? chevrons(d.site) : '<p class="empty">Site numbers unavailable right now.</p>'}
    <p class="meta hqf__key">% = share that moved on from the step before. ▼ marks the biggest leak.</p>
  </section>`;
  const bnHtml = `<section class="sec"><div class="today-head"><h2>Bottlenecks</h2><span class="meta">${bn.length} found, worst first</span></div>
    ${bn.length ? `<div class="bns">${bn.map((b) => `<article class="bnc s${b.sev}" ${b.brand ? `style="--c:${color(b.brand)}"` : ''}>
      <div class="bnc__top"><span class="sev s${b.sev}">${SEV[b.sev]}</span><span class="meta">blocks: ${esc(b.stage)}</span><span class="pill">${esc(b.who)}</span></div>
      <h3>${esc(b.title)}</h3><p class="meta">${esc(b.detail)}</p><p><b>Fix:</b> ${esc(b.fix)}</p>${b.act ? `<div>${b.act}</div>` : ''}</article>`).join('')}</div>` : '<div class="hint"><strong>No bottlenecks.</strong> Keep the daily sending rhythm going.</div>'}</section>`;
  const mail = (state.hq?.mail || []).filter((m) => inBrand(m.brand));
  const lanes = [['on', 'Connected', 'Sends, signs and tracks'], ['part', 'Partly connected', 'Works, with gaps'], ['off', 'Not connected', 'No outreach yet']];
  const mailHtml = state.hq ? `<section class="sec"><div class="today-head"><h2>Email connections</h2><span class="meta">${mail.filter((m) => m.state === 'on').length} connected · ${mail.filter((m) => m.state === 'off').length} not · checklist ${esc(state.hq.mailUpdated)}</span></div>
    <div class="lanes">${lanes.map(([k, label, hint]) => { const list = mail.filter((m) => m.state === k); return `<div class="lane ${k}"><h3><i></i>${label} <em>${list.length}</em></h3><p class="meta">${hint}</p>
      ${list.length ? list.map((m) => `<article class="mc" style="--c:${color(m.brand)}"><b>${esc(m.name)}</b><span class="meta mc__addr">${esc(m.address || 'no address yet')}</span>
        <ul>${state.hq.steps.map((st) => `<li class="${m.steps[st.key] ? 'ok' : 'no'}" title="${esc(st.help)}"><i>${m.steps[st.key] ? '✓' : '✕'}</i>${esc(st.label)}</li>`).join('')}</ul>
        <span class="meta">${m.lastIn || m.lastOut ? `Last in ${esc(ago(m.lastIn) || '–')} · last out ${esc(ago(m.lastOut) || '–')}` : esc(m.note || '')}</span>
        <span class="pill ${m.mailReady ? 'good' : m.inOutreach ? 'due' : ''}">${m.mailReady ? 'Outreach on' : m.inOutreach ? 'Outreach blocked' : 'Not in outreach'}</span></article>`).join('') : '<p class="empty">None</p>'}</div>`; }).join('')}</div></section>` : '';
  const extra = (state.hq?.mail || []).filter((m) => !m.inOutreach && state.brand === 'all').map((m) => ({ key: m.brand, name: m.name, extra: m }));
  const brands = state.board.brands.filter((b) => inBrand(b.key)).concat(extra);
  const pipeHtml = `<section class="sec"><div class="today-head"><h2>Brand pipeline</h2><span class="meta">Tap a brand to filter everything to it</span></div><div class="deals">${brands.map((b) => {
    const f = state.pipeline.funnel.find((x) => x.key === b.key);
    const st = (k) => f?.steps.find((x) => x.stage === k)?.count || 0;
    const s = state.hq?.sites[b.key];
    const m = (state.hq?.mail || []).find((x) => x.brand === b.key);
    const waiting = state.board.orgs.filter((o) => o.brand === b.key && o.stage === 'drafted').length;
    return `<article class="deal" style="--c:${color(b.key)}"><header><button class="deal__name" data-brand="${b.key}">${esc(b.name)}</button>
      <span class="pill ${m ? (m.state === 'on' ? 'good' : m.state === 'part' ? '' : 'due') : ''}">✉ ${m ? (m.state === 'on' ? 'connected' : m.state === 'part' ? 'partly' : 'not connected') : '–'}</span></header>
      ${b.extra ? `<p class="meta" style="margin:8px 0 0">${esc(b.extra.note || 'Not in outreach yet.')}</p>` : `<p class="hqf__label">Outreach${waiting ? ` · <b class="warn">${waiting} drafts waiting</b>` : ''}</p>
      ${chevrons([{ l: 'Found', v: st('found') }, { l: 'Sent', v: st('sent') }, { l: 'Replied', v: st('replied') }, { l: 'Linked', v: st('linked') }], { small: true, leak: false })}`}
      ${s ? `<p class="hqf__label">Site${s.ga4 ? '' : ' · <b class="warn">visits didn’t refresh</b>'}</p>${chevrons([{ l: 'Seen', v: s.seen }, { l: 'Visits', v: s.ga4 ? s.visits : null }, { l: 'Clicks', v: s.ga4 ? s.clicks : null }, { l: 'Money', v: s.tracksMoney && s.ga4 ? s.money : null }], { small: true, leak: false })}` : ''}
    </article>`; }).join('')}</div></section>`;
  $('#view').innerHTML = funnel + bnHtml + mailHtml + pipeHtml;
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.hqgo) { const [v, b] = t.dataset.hqgo.split('|'); state.view = v; if (b) state.brand = b; if (v === 'board') state.fullBoard = true; save(); render(); window.scrollTo(0, 0); }
  else if (t.dataset.view) { state.view = t.dataset.view; $('#more-menu').hidden = true; save(); render(); window.scrollTo(0, 0); }
  else if (t.dataset.brand) { state.brand = t.dataset.brand; save(); render(); }
  else if (t.dataset.retry) { const o = state.board.orgs.find((x) => String(x.id) === t.dataset.retry); if (o) openDraft(o.brand, o.target, o); }
  else if (t.dataset.org) openOrg(Number(t.dataset.org));
  else if (t.dataset.more) { state.showAll[t.dataset.more] = !state.showAll[t.dataset.more]; renderProspect(); }
  else if (t.dataset.draft) { const [b, k] = t.dataset.draft.split('|'); openDraft(b, k); }
  else if (t.id === 'more-btn') { const m = $('#more-menu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); }
  else if (t.dataset.aff) openAffiliate(t.dataset.aff);
  else if (t.dataset.rdraft) { const o = state.radar.queue.find((x) => String(x.id) === t.dataset.rdraft); if (o) openDraft(o.brand, o.target, o); }
  else if (t.dataset.rdrop) radarReview(t.dataset.rdrop, $('#rdrop-' + t.dataset.rdrop).value, $('#rwhy-' + t.dataset.rdrop).value);
  else if (t.dataset.rlater) radarReview(t.dataset.rlater, 'later');
  else if (t.dataset.uncoach !== undefined) { const i = Number(t.dataset.uncoach); api('/api/radar/coaching', { rules: state.radar.coaching.filter((_, j) => j !== i) }).then((res) => { state.radar.coaching = res.rules; toast('Rule removed'); renderToday(); }).catch((e) => toast(e.message)); }
  else if (t.dataset.nexpand) { state.open['n' + t.dataset.nexpand] = !state.open['n' + t.dataset.nexpand]; renderToday(); }
  else if (t.dataset.nreply) {
    const m = state.needs.messages.find((x) => String(x.id) === t.dataset.nreply); if (!m) return;
    const w = isPhone() ? null : window.open('about:blank', '_blank');
    compose(m.mail_from, /^re:/i.test(m.subject || '') ? m.subject : 'Re: ' + (m.subject || ''), '', w);
    toast('Reply opened. It drops off this list once your reply goes out.');
  }
  else if (t.dataset.ndone) api('/api/messages/' + t.dataset.ndone + '/handled', {}).then(() => { toast('Ticked off'); load(); }).catch((e) => toast(e.message));
  else if (t.dataset.noptout) {
    const m = state.needs.messages.find((x) => String(x.id) === t.dataset.noptout); if (!m) return;
    api('/api/orgs/' + m.org_id + '/stage', { stage: 'no', note: 'no thanks (marked in Today)' })
      .then(() => api('/api/messages/' + m.id + '/handled', {})).then(() => { toast('Opted out. No brand contacts them again'); load(); }).catch((e) => toast(e.message));
  }
  else if (t.dataset.fu) { const o = state.board.orgs.find((x) => String(x.id) === t.dataset.fu); if (o) openFollowUp(o); }
  else if (t.dataset.fuclose) api('/api/orgs/' + t.dataset.fuclose + '/close', {}).then(() => { toast('Closed: no reply'); load(); }).catch((e) => toast(e.message));
  else if (t.dataset.expand) { state.open[t.dataset.expand] = !state.open[t.dataset.expand]; renderReplies(); }
});
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') e.target.close(); });
load();
setInterval(() => { if (!$('#sheet').open && document.visibilityState === 'visible') load(); }, 60000);
</script>
